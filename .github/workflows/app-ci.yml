name: app-ci

# Lint, unit, integration and E2E tests of the application (STP §6). MongoDB runs as a service
# container; the test set-ups use it through TEST_MONGO_URL instead of starting a local mongod.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung Jest or Playwright process must not hold the runner for the 6-hour default.
    timeout-minutes: 45
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        # The job's steps start only after the container reports healthy (accepts commands).
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
